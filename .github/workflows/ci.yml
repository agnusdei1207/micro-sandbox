name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate

  native:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - run: cargo build --locked --release --manifest-path native/Cargo.toml

  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - run: npm ci
      - run: npm run build:native:docker
      - run: npm run test:kernel
      - run: npm run test:integration
